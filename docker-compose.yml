services:
  postgres:
    image: postgres:16-alpine
    container_name: mobile-reserve-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reserve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-mobile_reserve}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    image: ghcr.io/bastimuensch/mobile-reserve-app:latest
    container_name: mobile-reserve-app
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-reserve}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mobile_reserve}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      SETUP_TOKEN: ${SETUP_TOKEN:?SETUP_TOKEN must be set for secure first-run setup}
      SMTP_ENCRYPTION_KEY: ${SMTP_ENCRYPTION_KEY:?SMTP_ENCRYPTION_KEY must be a base64 encoded 32-byte key}
      SMTP_ENCRYPTION_KEY_PREVIOUS: ${SMTP_ENCRYPTION_KEY_PREVIOUS:-}
      INVITATION_TOKEN_PEPPER: ${INVITATION_TOKEN_PEPPER:?INVITATION_TOKEN_PEPPER must be set}
      # Rein informativer, serverseitiger Check auf stabile GitHub-Releases.
      UPDATE_CHECK_ENABLED: ${UPDATE_CHECK_ENABLED:-true}
      GEOCODING_BASE_URL: ${GEOCODING_BASE_URL:-https://nominatim.openstreetmap.org}
      GEOCODING_USER_AGENT: ${GEOCODING_USER_AGENT:-MobileReserve.digital/1.0}
      CRON_SECRET: ${CRON_SECRET:-}
      # Eingebauter DSGVO-Zeitplan; auf "off" setzen, um stattdessen extern per Cron auszulösen
      GDPR_CLEANUP_SCHEDULER: ${GDPR_CLEANUP_SCHEDULER:-}
      # Pflicht: Basis-URL für Passwort-Reset-Links (siehe DEPLOYMENT.md)
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL must be set}
      NODE_ENV: production
      # VAPID-Schlüssel für Push-Benachrichtigungen (optional, siehe .env.example - ohne
      # gesetztes Paar erzeugt die App eines in der DB, das bei DB-Verlust verloren geht).
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      # Kein hartcodierter Default hier: bleibt VAPID_SUBJECT leer, fällt push.ts automatisch
      # auf NEXT_PUBLIC_APP_URL zurück (gültiges https-Subject), statt ein Platzhalter-Mailto
      # zu verwenden, das manche Push-Dienste ablehnen (siehe Commit a19c632).
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    volumes:
      - uploads-data:/app/public/uploads
      - private-uploads-data:/app/private-uploads
    restart: unless-stopped
    command: sh -c "npx prisma migrate deploy && npm run start"

volumes:
  postgres-data:
  uploads-data:
  private-uploads-data:
