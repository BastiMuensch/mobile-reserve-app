version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mobile-reserve-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mobile_reserve
      POSTGRES_USER: reserve_user
      POSTGRES_PASSWORD: reserve_password_change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build: .
    container_name: mobile-reserve-app
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    environment:
      - DATABASE_URL=postgresql://reserve_user:reserve_password_change_me@postgres:5432/mobile_reserve?schema=public
      - NODE_ENV=production
    restart: unless-stopped
    command: sh -c "npx prisma migrate deploy && npm run start"

volumes:
  postgres-data:
